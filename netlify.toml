[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Preserve the callback URL used by the previous website.
[[redirects]]
  from = "/request-a-call"
  to = "/#callback"
  status = 301

[[redirects]]
  from = "/request-a-call/"
  to = "/#callback"
  status = 301
