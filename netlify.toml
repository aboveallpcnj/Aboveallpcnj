[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Serve the dedicated callback page at its established clean URL.
[[redirects]]
  from = "/request-a-call"
  to = "/request-a-call.html"
  status = 200

[[redirects]]
  from = "/request-a-call/"
  to = "/request-a-call"
  status = 301
